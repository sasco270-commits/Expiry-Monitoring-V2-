<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SASCO Palm · Expiry Monitoring</title>
<style>
:root{--blue:#2457d6;--dark:#172033;--muted:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--white:#fff;--green:#087f5b;--red:#c92a2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--dark)}
header{background:var(--white);border-bottom:1px solid var(--line);padding:18px 24px;position:sticky;top:0;z-index:5}
.header{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
main{max-width:1200px;margin:24px auto;padding:0 18px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 18px rgba(15,23,42,.04)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#475569}
input,select{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;font-size:14px;background:#fff}
h2{font-size:16px;margin:0 0 15px}.items{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:13px}th{background:#f8fafc}
td input{height:36px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.add{background:#e8efff;color:var(--blue)}.save{background:#fff;border:1px solid #cbd5e1;color:var(--dark)}.submit{background:var(--blue);color:#fff}.remove{background:#fff0f0;color:var(--red);padding:8px 10px}
#status{margin-top:12px;padding:10px;border-radius:8px;font-size:13px;display:none}.ok{background:#e8fff5;color:var(--green)}.err{background:#fff0f0;color:var(--red)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:0 10px}.card{padding:14px}}
</style>
</head>
<body>
<header><div class="header"><div><h1>SASCO Palm · Expiry Monitoring</h1><div class="sub">Firebase + GitHub submission form</div></div><div id="authStatus" class="sub">Connecting...</div></div></header>
<main>
<section class="card">
<h2>Store & Cycle Information</h2>
<div class="grid">
<div class="field"><label>Store Code</label><input id="storeCode" placeholder="Enter store code"></div>
<div class="field"><label>Store Name</label><input id="storeName" placeholder="Enter store name"></div>
<div class="field"><label>Area Manager</label><input id="areaManager" placeholder="Enter area manager"></div>
<div class="field"><label>Operation Manager</label><input id="operationManager" placeholder="Enter operation manager"></div>
<div class="field"><label>Category</label><input id="category" placeholder="e.g. Food & Grocery - Non Food"></div>
<div class="field"><label>Cycle Start</label><input id="cycleStart" type="date"></div>
<div class="field"><label>Cycle End</label><input id="cycleEnd" type="date"></div>
</div>
</section>
<section class="card">
<h2>Expiry Items</h2>
<div class="items"><table><thead><tr><th>SKU</th><th>Item Name</th><th>Quantity</th><th>Expiry Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="actions" style="margin-top:15px"><button class="add" onclick="addRow()">+ Add Item</button></div>
</section>
<section class="card">
<div class="actions"><button class="save" onclick="saveDraft()">Save Draft</button><button class="submit" onclick="submitForm()">Submit</button></div>
<div id="status"></div>
</section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
