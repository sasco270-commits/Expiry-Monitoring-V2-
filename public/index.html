<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SASCO Palm · Expiry Monitoring</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }


    /* ==============================
       HEADER
    ============================== */

    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 18px 24px;

      position: sticky;
      top: 0;

      z-index: 100;
    }


    .header-inner {
      max-width: 1450px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }


    .title {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }


    .subtitle {
      margin-top: 4px;

      font-size: 12px;
      color: #64748b;
    }


    #authStatus {
      font-size: 12px;
      color: #64748b;
      white-space: nowrap;
    }


    /* ==============================
       MAIN
    ============================== */

    main {
      max-width: 1450px;
      margin: 25px auto;
      padding: 0 18px;
    }


    .card {
      background: #ffffff;

      border: 1px solid #e2e8f0;
      border-radius: 16px;

      padding: 20px;

      margin-bottom: 18px;

      box-shadow:
        0 5px 20px
        rgba(15, 23, 42, 0.04);
    }


    .section-title {
      font-size: 16px;
      font-weight: 800;

      margin: 0 0 16px;
    }


    /* ==============================
       FORM GRID
    ============================== */

    .form-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;
    }


    .field label {

      display: block;

      font-size: 12px;
      font-weight: 700;

      color: #475569;

      margin-bottom: 6px;
    }


    input,
    select {

      width: 100%;

      height: 42px;

      border:
        1px solid #cbd5e1;

      border-radius: 9px;

      padding:
        0 11px;

      font-size: 14px;

      background: #ffffff;

      outline: none;
    }


    input:focus,
    select:focus {

      border-color: #2457d6;

      box-shadow:
        0 0 0 3px
        rgba(36, 87, 214, 0.10);
    }


    input[readonly] {

      background: #f8fafc;

      color: #334155;
    }


    /* ==============================
       STORE LOOKUP
    ============================== */

    .lookup-status {

      min-height: 16px;

      margin-top: 4px;

      font-size: 11px;

      color: #64748b;
    }


    /* ==============================
       ITEMS TABLE
    ============================== */

    .table-container {

      width: 100%;

      overflow-x: auto;

      border:
        1px solid #e2e8f0;

      border-radius: 10px;
    }


    table {

      width: 100%;

      min-width: 1550px;

      border-collapse:
        collapse;
    }


    th {

      background: #f8fafc;

      color: #334155;

      font-size: 12px;

      font-weight: 800;

      padding: 10px;

      text-align: left;

      white-space: nowrap;

      border-bottom:
        1px solid #e2e8f0;
    }


    td {

      padding: 7px;

      border-bottom:
        1px solid #e2e8f0;

      vertical-align: middle;
    }


    td input {

      height: 36px;

      min-width: 90px;

      font-size: 13px;
    }


    td .lookup-input {

      min-width: 145px;
    }


    td .itemName {

      min-width: 230px;
    }


    td .supplier {

      min-width: 170px;
    }


    /* ==============================
       BUTTONS
    ============================== */

    .button-row {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 10px;

      margin-top: 15px;

      flex-wrap: wrap;
    }


    .left-buttons,
    .right-buttons {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }


    button {

      border: 0;

      border-radius: 9px;

      padding:
        11px 17px;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      transition:
        .15s ease;
    }


    button:hover {

      transform:
        translateY(-1px);
    }


    .add-button {

      background: #e8efff;

      color: #2457d6;
    }


    .save-button {

      background: #ffffff;

      color: #172033;

      border:
        1px solid #cbd5e1;
    }


    .submit-button {

      background: #2457d6;

      color: #ffffff;
    }


    .remove {

      background: #fff0f0;

      color: #c92a2a;

      padding:
        8px 11px;
    }


    /* ==============================
       STATUS
    ============================== */

    #status {

      display: none;

      margin-top: 14px;

      padding: 11px 13px;

      border-radius: 9px;

      font-size: 13px;

      font-weight: 600;
    }


    .ok {

      display: block !important;

      background: #e8fff5;

      color: #087f5b;
    }


    .info {

      display: block !important;

      background: #eef5ff;

      color: #2457d6;
    }


    .err {

      display: block !important;

      background: #fff0f0;

      color: #c92a2a;
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 1100px) {

      .form-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 600px) {

      header {

        padding:
          15px;
      }


      .header-inner {

        align-items:
          flex-start;

        flex-direction:
          column;
      }


      main {

        padding:
          0 10px;
      }


      .card {

        padding:
          14px;
      }


      .form-grid {

        grid-template-columns:
          1fr;
      }


      .title {

        font-size: 19px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       HEADER
  ========================================== -->

  <header>

    <div class="header-inner">

      <div>

        <div class="title">
          SASCO Palm · Expiry Monitoring
        </div>

        <div class="subtitle">
          Firebase Live Master Data
        </div>

      </div>


      <div id="authStatus">
        Connecting to Firebase...
      </div>

    </div>

  </header>



  <!-- =========================================
       MAIN
  ========================================== -->

  <main>


    <!-- =======================================
         STORE INFORMATION
    ======================================== -->

    <section class="card">

      <div class="section-title">
        Store & Cycle Information
      </div>


      <div class="form-grid">


        <!-- STORE CODE -->

        <div class="field">

          <label>
            Store Code
          </label>

          <input
            id="storeCode"
            type="text"
            placeholder="Enter Store Code"
            autocomplete="off"
          >

          <div
            id="storeLookupStatus"
            class="lookup-status"
          ></div>

        </div>


        <!-- STORE NAME -->

        <div class="field">

          <label>
            Store Name
          </label>

          <input
            id="storeName"
            type="text"
            readonly
            placeholder="Auto loaded"
          >

        </div>


        <!-- AREA MANAGER -->

        <div class="field">

          <label>
            Area Manager
          </label>

          <input
            id="areaManager"
            type="text"
            readonly
            placeholder="Auto loaded"
          >

        </div>


        <!-- OPERATION MANAGER -->

        <div class="field">

          <label>
            Operation Manager
          </label>

          <input
            id="operationManager"
            type="text"
            readonly
            placeholder="Auto loaded"
          >

        </div>


        <!-- CATEGORY -->

        <div class="field">

          <label>
            Category
          </label>

          <input
            id="category"
            type="text"
            placeholder="Enter Category"
          >

        </div>


        <!-- CYCLE START -->

        <div class="field">

          <label>
            Cycle Start
          </label>

          <input
            id="cycleStart"
            type="date"
          >

        </div>


        <!-- CYCLE END -->

        <div class="field">

          <label>
            Cycle End
          </label>

          <input
            id="cycleEnd"
            type="date"
          >

        </div>


      </div>

    </section>



    <!-- =======================================
         EXPIRY ITEMS
    ======================================== -->

    <section class="card">

      <div class="section-title">
        Expiry Items
      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>
                SKU
              </th>

              <th>
                Barcode
              </th>

              <th>
                UOM
              </th>

              <th>
                EN Desc
              </th>

              <th>
                Cost
              </th>

              <th>
                Default Supplier
              </th>

              <th>
                Vendor Code
              </th>

              <th>
                Category
              </th>

              <th>
                Returnable
              </th>

              <th>
                Qty
              </th>

              <th>
                Expiry Date
              </th>

              <th>
                Days Left
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody id="rows">
          </tbody>

        </table>

      </div>


      <div class="button-row">

        <div class="left-buttons">

          <button
            type="button"
            class="add-button"
            onclick="addRow()"
          >
            + Add Item
          </button>

        </div>

      </div>

    </section>



    <!-- =======================================
         ACTIONS
    ======================================== -->

    <section class="card">

      <div class="button-row">

        <div></div>


        <div class="right-buttons">

          <button
            type="button"
            class="save-button"
            onclick="saveDraft()"
          >
            Save Draft
          </button>


          <button
            type="button"
            class="submit-button"
            onclick="submitForm()"
          >
            Submit
          </button>

        </div>

      </div>


      <div id="status"></div>

    </section>


  </main>



  <!-- =========================================
       FIREBASE / APP SCRIPT
  ========================================== -->

  <script
    type="module"
    src="app.js"
  ></script>


</body>

</html>
